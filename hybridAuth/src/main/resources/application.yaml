server:
  address: 0.0.0.0

spring:
  application:
    name: hybridAuth

  datasource:
    url: jdbc:postgresql://localhost:5432/hdfc-auth
    username: postgres
    password: postgreSQL@DB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

app:
  jwt:
    secret: MySuperSecretKeyForHdfcAuth12345678901234567890
  auth:
    expiryScanMillis: 60000

otp:
  expiry-seconds: 300
  max-attempts: 3

wa:
  expiry-seconds: 300
